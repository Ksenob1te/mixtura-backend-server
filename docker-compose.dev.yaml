version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mixtura-auth
    ports:
      - "5432:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./.local/redis:/data